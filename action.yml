name: "CodeGuardian PR Review"
description: "Review pull-request diffs for security, performance and maintainability issues"
author: "CodeGuardian"

branding:
  icon: "shield"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token with pull-request read and write permissions"
    required: true
    default: ${{ github.token }}
  anthropic_api_key:
    description: "Optional Anthropic API key for AI-assisted review"
    required: false
  use_ai:
    description: "Enable AI-assisted review"
    required: false
    default: "false"
  model:
    description: "AI model identifier"
    required: false
    default: "claude-sonnet-4-20250514"
  fail_on:
    description: "Fail when findings at this severity or above are reported"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Install CodeGuardian
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"

    - name: Get pull-request diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        DIFF_PATH: ${{ runner.temp }}/codeguardian-pr.diff
      run: |
        set -euo pipefail
        gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > "$DIFF_PATH"

    - name: Run CodeGuardian
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        USE_AI: ${{ inputs.use_ai }}
        MODEL: ${{ inputs.model }}
        FAIL_ON: ${{ inputs.fail_on }}
        DIFF_PATH: ${{ runner.temp }}/codeguardian-pr.diff
        REVIEW_PATH: ${{ runner.temp }}/codeguardian-review.json
      run: |
        set -euo pipefail
        args=(review "$DIFF_PATH")
        if [[ "${USE_AI,,}" == "true" ]]; then
          args+=(--ai --model "$MODEL")
        fi
        if [[ -n "$FAIL_ON" ]]; then
          args+=(--fail-on "$FAIL_ON")
        fi
        set +e
        codeguardian "${args[@]}" --json > "$REVIEW_PATH"
        result=$?
        set -e
        exit "$result"

    - name: Post review summary
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        REVIEW_PATH: ${{ runner.temp }}/codeguardian-review.json
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        if [[ ! -s "$REVIEW_PATH" ]]; then
          echo "No review result was produced; skipping PR comment."
          exit 0
        fi
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        result = json.loads(Path(os.environ["REVIEW_PATH"]).read_text(encoding="utf-8"))
        def clean(value):
            return str(value).replace("|", chr(92) + "|").replace(chr(13), " ").replace(chr(10), " ")
        body = ["## CodeGuardian Review", "", clean(result.get("summary", "Review completed.")), "", f"**Risk score:** {int(result.get('risk_score', 0))}/100", ""]
        findings = result.get("findings") or []
        if findings:
            body.extend(["| Severity | Category | File | Issue |", "|---|---|---|---|"])
            for finding in findings:
                location = clean(finding.get("file", "unknown"))
                if finding.get("line"):
                    location += f":{int(finding['line'])}"
                cells = (clean(finding.get("severity", "info")), clean(finding.get("category", "unknown")), location, clean(finding.get("title", "Finding")))
                body.append("| " + " | ".join(cells) + " |")
        else:
            body.append("No issues were reported by the configured checks.")
        body.extend(["", "---", "*Reviewed by CodeGuardian*"])
        Path(os.environ["RUNNER_TEMP"], "codeguardian-review.md").write_text(chr(10).join(body), encoding="utf-8")
        PY
        gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/codeguardian-review.md"
